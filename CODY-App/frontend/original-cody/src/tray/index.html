<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'"><title>CODY menu</title><link rel="stylesheet" href="style.css"></head>
<body><main class="menu" aria-label="CODY tray menu">
<header><img src="../../assets/brand/cody-256.png" alt=""><div><strong>C.O.D.Y.</strong><span>Your desktop assistant</span></div></header>
<div class="divider"></div>
<button data-action="open" class="open"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 9h18m-10 5 3 2-3 2"/></svg><span>Open CODY</span><svg class="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
<button data-action="controls" role="switch" aria-checked="false"><svg viewBox="0 0 24 24"><path d="m5 3 14 9-7 1-3 7-4-17Z"/></svg><span>Computer controls</span><i class="switch" aria-hidden="true"></i></button>
<button data-action="background" role="switch" aria-checked="false"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-8-8m4-1h5v5m0-5-8 8"/></svg><span>Run in background</span><i class="switch" aria-hidden="true"></i></button>
<div class="divider"></div>
<button data-action="quit" class="quit"><svg viewBox="0 0 24 24"><path d="M12 3v9m-5-7a8 8 0 1 0 10 0"/></svg><span>Quit CODY</span></button>
</main><script src="renderer.js"></script></body></html>
