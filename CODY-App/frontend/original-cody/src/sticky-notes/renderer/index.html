<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Cody sticky note</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><span class="grip" aria-hidden="true">⠿</span><span>Sticky note</span><button id="close" aria-label="Delete note" title="Delete note">×</button></header>
  <textarea id="text" aria-label="Note text" placeholder="Write a note…" maxlength="30000" spellcheck="true"></textarea>
  <footer id="status" role="status">Visible across apps · Saved on this device</footer>
  <script src="note.js"></script>
</body>
</html>
