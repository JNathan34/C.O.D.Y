name: Voice Lab static checks
on:
  push:
    branches:
      - voice-lab-v0.3
      - voice-lab-v0.4
  workflow_dispatch:
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript syntax
        shell: pwsh
        run: |
          node --check voice-lab-v0.4/main.js
          node --check voice-lab-v0.4/preload.js
          node --check voice-lab-v0.4/renderer.js
      - name: Verify Python syntax
        shell: pwsh
        run: python -m py_compile voice-lab-v0.4/speech.py
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "voice-lab-v0.4/sapi.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
