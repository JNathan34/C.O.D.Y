name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CODY-App
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CODY-App/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tools/drawing-controls-tests/DrawingControlsTests.csproj -c Release
      - run: dotnet run --project tools/drawing-target-tests/DrawingTargetTests.csproj -c Release
